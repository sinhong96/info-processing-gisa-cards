<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>정보처리기사 암기 카드</title>
<style>
  :root{--bg:#f2f3f5;--fg:#1a1a1a;--card:#fff;--muted:#7a828a;--line:#e2e5e8;--blue:#0b8ad4}
  @media (prefers-color-scheme:dark){
    :root{--bg:#16181c;--fg:#e8eaed;--card:#1f2227;--muted:#9aa4ae;--line:#2c3036}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;
       display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
  header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  header b{font-size:15px}
  .count{color:var(--muted);font-size:13px;margin-left:auto;font-variant-numeric:tabular-nums}
  button{font:inherit;font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);
         background:var(--card);color:var(--fg);cursor:pointer}
  button.on{background:var(--blue);border-color:var(--blue);color:#fff}
  select{font:inherit;font-size:13px;font-weight:700;padding:6px 10px;border-radius:8px;
         border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;
         max-width:46vw}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:16px}
  .card{background:var(--card);border-radius:16px;box-shadow:0 2px 18px rgba(0,0,0,.12);
        width:100%;max-width:760px;padding:22px;cursor:pointer;user-select:none}
  .front{text-align:center;padding:64px 20px}
  .front .num{font-size:44px;font-weight:800;color:var(--blue);font-variant-numeric:tabular-nums}
  .front .ttl{font-size:26px;font-weight:800;margin-top:10px;line-height:1.35}
  .front .tap{margin-top:32px;color:var(--muted);font-size:13px}
  .card svg{width:100%;height:auto;display:block}
  ul{margin:16px 0 0;padding-left:20px;line-height:1.65;font-size:15px}
  li{margin-bottom:7px}
  .hook{margin-top:14px;text-align:center;color:#e03131;font-weight:800;font-size:15px}
  footer{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);justify-content:center;
         padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  .empty{color:var(--muted);text-align:center;padding:60px 20px;line-height:1.7}
</style>

<header>
  <select id="subjsel" aria-label="과목 선택"></select>
  <button id="shuffle">🔀 섞기</button>
  <button id="hardonly">😵 어려운 것만</button>
  <button id="reset">↺ 초기화</button>
  <span class="count" id="count"></span>
</header>

<main><div class="card" id="card"></div></main>

<footer>
  <button id="prev">← 이전</button>
  <button id="flip">뒤집기 (space)</button>
  <button id="hard">😵 어려움</button>
  <button id="known">✅ 암기함</button>
  <button id="next">다음 →</button>
</footer>

dth=\"2\"/>\n  <text x=\"612\" y=\"122\" font-size=\"26\" text-anchor=\"middle\">🔒<\/text>\n  <text x=\"612\" y=\"152\" font-size=\"13\" font-weight=\"800\" text-anchor=\"middle\" fill=\"#0a3d5c\">내부 동작 불가시<\/text>\n  <text x=\"612\" y=\"170\" font-size=\"11\" text-anchor=\"middle\" fill=\"#9aa4ae\">별도 SW 필요<\/text><\/g><\/svg>"}, {"id": "055", "title": "미들웨어의 종류", "bullets": ["DB(DataBase)", "RPC(Remote Procedure Call)", "MOM(Message Oriented Middleware)", "TP(Transaction Processing)-Monitor", "ORB(Object Request Broker)", "WAS(Web Application Server)"], "kind": "diagram", "hook": "DB·RPC·MOM·TP·ORB·WAS", "subject": 1, "subjectName": "소프트웨어 설계", "svg": "<svg viewBox=\"0 0 720 296\" font-family=\"-apple-system,'Apple SD Gothic Neo',sans-serif\"><rect x=\"24\" y=\"14\" width=\"72\" height=\"46\" rx=\"4\" fill=\"#0b8ad4\"/><text x=\"60\" y=\"47\" font-size=\"27\" font-weight=\"800\" fill=\"#fff\" text-anchor=\"middle\" font-family=\"Helvetica\">055<\/text><rect x=\"100\" y=\"14\" width=\"596\" height=\"46\" rx=\"4\" fill=\"#d3d5d8\"/><text x=\"122\" y=\"46\" font-size=\"24\" font-weight=\"800\" fill=\"#1a1a1a\">미들웨어의 종류<\/text><g transform=\"translate(0,76)\"><rect x=\"24\"  y=\"16\" width=\"209\" height=\"84\" rx=\"10\" fill=\"#e8f4fc\" stroke=\"#0b8ad4\" stroke-width=\"2\"/>\n  <text x=\"64\"  y=\"54\"  font-size=\"28\" text-anchor=\"middle\">🗄️<\/text>\n  <text x=\"64\"  y=\"82\"  font-size=\"13\" text-anchor=\"middle\" fill=\"#9aa4ae\">DB<\/text>\n  <text x=\"180\" y=\"46\"  font-size=\"15\" font-weight=\"800\" fill=\"#0a3d5c\" text-anchor=\"middle\">DB<\/text>\n  <text x=\"180\" y=\"66\"  font-size=\"12\" fill=\"#1a1a1a\" text-anchor=\"middle\">DataBase<\/text>\n  <text x=\"180\" y=\"84\"  font-size=\"11\" fill=\"#9aa4ae\" text-anchor=\"middle\">데이터베이스 접근<\/text>\n  <rect x=\"245\" y=\"16\" width=\"230\" height=\"84\" rx=\"10\" fill=\"#fff3d6\" stroke=\"#e8b33a\" stroke-width=\"2\"/>\n  <text x=\"285\" y=\"54\"  font-size=\"28\" text-anchor=\"middle\">📞<\/text>\n  <text x=\"285\" y=\"82\"  font-size=\"13\" text-anchor=\"middle\" fill=\"#9aa4ae\">RPC<\/text>\n  <text x=\"400\" y=\"46\"  font-size=\"15\" font-weight=\"800\" fill=\"#7a4f00\" text-anchor=\"middle\">RPC<\/text>\n  <text x=\"400\" y=\"66\"  font-size=\"12\" fill=\"#1a1a1a\" text-anchor=\"middle\">Remote Procedure Call<\/text>\n  <text x=\"400\" y=\"84\"  font-size=\"11\" fill=\"#9aa4ae\" text-anchor=\"middle\">원격 프로시저 호출<\/text>\n  <rect x=\"487\" y=\"16\" width=\"209\" height=\"84\" rx=\"10\" fill=\"#eef1f4\" stroke=\"#9aa4ae\" stroke-width=\"2\"/>\n  <text x=\"527\" y=\"54\"  font-size=\"28\" text-anchor=\"middle\">✉️<\/text>\n  <text x=\"527\" y=\"82\"  font-size=\"13\" text-anchor=\"middle\" fill=\"#9aa4ae\">MOM<\/text>\n  <text x=\"643\" y=\"46\"  font-size=\"15\" font-weight=\"800\" fill=\"#1a1a1a\" text-anchor=\"middle\">MOM<\/text>\n  <text x=\"643\" y=\"66\"  font-size=\"12\" fill=\"#1a1a1a\" text-anchor=\"middle\">Message Oriented<\/text>\n  <text x=\"643\" y=\"84\"  font-size=\"11\" fill=\"#9aa4ae\" text-anchor=\"middle\">메시지 기반 통신<\/text>\n  <rect x=\"24\"  y=\"116\" width=\"209\" height=\"84\" rx=\"10\" fill=\"#e8f4fc\" stroke=\"#0b8ad4\" stroke-width=\"2\"/>\n  <text x=\"64\"  y=\"154\" font-size=\"28\" text-anchor=\"middle\">💳<\/text>\n  <text x=\"64\"  y=\"182\" font-size=\"13\" text-anchor=\"middle\" fill=\"#9aa4ae\">TP<\/text>\n  <text x=\"180\" y=\"146\" font-size=\"15\" font-weight=\"800\" fill=\"#0a3d5c\" text-anchor=\"middle\">TP-Monitor<\/text>\n  <text x=\"180\" y=\"166\" font-size=\"12\" fill=\"#1a1a1a\" text-anchor=\"middle\">Transaction Processing<\/text>\n  <text x=\"180\" y=\"184\" font-size=\"11\" fill=\"#9aa4ae\" text-anchor=\"middle\">트랜잭션 처리 모니터<\/text>\n  <rect x=\"245\" y=\"116\" width=\"230\" height=\"84\" rx=\"10\" fill=\"#fff3d6\" stroke=\"#e8b33a\" stroke-width=\"2\"/>\n  <text x=\"285\" y=\"154\" font-size=\"28\" text-anchor=\"middle\">🌐<\/text>\n  <text x=\"285\" y=\"182\" font-size=\"13\" text-anchor=\"middle\" fill=\"#9aa4ae\">ORB<\/text>\n  <text x=\"400\" y=\"146\" font-size=\"15\" font-weight=\"800\" fill=\"#7a4f00\" text-anchor=\"middle\">ORB<\/text>\n  <text x=\"400\" y=\"166\" font-size=\"12\" fill=\"#1a1a1a\" text-anchor=\"middle\">Object Request Broker<\/text>\n  <text x=\"400\" y=\"184\" font-size=\"11\" fill=\"#9aa4ae\" text-anchor=\"middle\">객체 기반 분산 환경<\/text>\n  <rect x=\"487\" y=\"116\" width=\"209\" height=\"84\" rx=\"10\" fill=\"#eef1f4\" stroke=\"#9aa4ae\" stroke-width=\"2\"/>\n  <text x=\"527\" y=\"154\" font-size=\"28\" text-anchor=\"middle\">🖥️<\/text>\n  <text x=\"527\" y=\"182\" font-size=\"13\" text-anchor=\"middle\" fill=\"#9aa4ae\">WAS<\/text>\n  <text x=\"643\" y=\"146\" font-size=\"15\" font-weight=\"800\" fill=\"#1a1a1a\" text-anchor=\"middle\">WAS<\/text>\n  <text x=\"643\" y=\"166\" font-size=\"12\" fill=\"#1a1a1a\" text-anchor=\"middle\">Web Application Server<\/text>\n  <text x=\"643\" y=\"184\" font-size=\"11\" fill=\"#9aa4ae\" text-anchor=\"middle\">웹 기반 서비스 처리<\/text><\/g><\/svg>"}];
const KEY = "gisa-cards-v1";
let mark = {};
try { mark = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { mark = {}; }
const save = () => localStorage.setItem(KEY, JSON.stringify(mark));

const SUBJ_KEY = "gisa-cards-subject";
let order = CARDS.slice();          // card order; shuffling permutes this
let subj = 0;                       // 0 = 전체, otherwise a 과목 number
let i = 0, flipped = false, hardOnly = false;

try {
  const saved = parseInt(localStorage.getItem(SUBJ_KEY) || "0", 10);
  if (saved && CARDS.some(c => c.subject === saved)) subj = saved;
} catch (e) { subj = 0; }

// Cards in the chosen 과목, before the 어려움 filter.
function subjectDeck() {
  return subj ? order.filter(c => c.subject === subj) : order;
}
function activeDeck() {
  const d = subjectDeck();
  return hardOnly ? d.filter(c => mark[c.id] === "hard") : d;
}

function buildSubjectSelect() {
  const sel = document.getElementById("subjsel");
  const seen = [];
  CARDS.forEach(c => {
    if (!seen.some(s => s.n === c.subject)) seen.push({n: c.subject, name: c.subjectName});
  });
  seen.sort((a, b) => a.n - b.n);
  let html = "";
  if (seen.length > 1) html += '<option value="0">전체 ' + CARDS.length + '장</option>';
  seen.forEach(s => {
    const n = CARDS.filter(c => c.subject === s.n).length;
    html += '<option value="' + s.n + '">' + s.n + "과목 " + esc(s.name) + " " + n + "장</option>";
  });
  sel.innerHTML = html;
  if (seen.length === 1) subj = seen[0].n;
  sel.value = String(subj);
}

function render() {
  const d = activeDeck(), el = document.getElementById("card");
  if (!d.length) {
    el.innerHTML = hardOnly
      ? '<div class="empty">이 과목에 어려움으로 표시한 카드가 없습니다.<br>"어려운 것만"을 다시 눌러 전체 카드로 돌아가세요.</div>'
      : '<div class="empty">이 과목은 아직 카드가 없습니다.</div>';
    document.getElementById("count").textContent = "0 / 0";
    return;
  }
  if (i >= d.length) i = 0;
  if (i < 0) i = d.length - 1;
  const c = d[i];
  el.innerHTML = flipped
    ? c.svg + "<ul>" + c.bullets.map(b => "<li>" + esc(b) + "</li>").join("") + "</ul>"
        + (c.hook ? '<div class="hook">' + esc(c.hook) + "</div>" : "")
    : '<div class="front"><div class="num">' + c.id + '</div><div class="ttl">'
        + esc(c.title) + '</div><div class="tap">탭하거나 space를 눌러 뒤집기</div></div>';
  const scope = subjectDeck();
  const known = scope.filter(x => mark[x.id] === "known").length;
  const badge = mark[c.id] === "hard" ? " 😵" : mark[c.id] === "known" ? " ✅" : "";
  document.getElementById("count").textContent =
    (i + 1) + " / " + d.length + badge + "   ·   암기 " + known + "/" + scope.length;
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function go(n) { i += n; flipped = false; render(); }
function setMark(v) {
  const d = activeDeck(); if (!d.length) return;
  const id = d[i].id;
  mark[id] = mark[id] === v ? undefined : v;
  if (mark[id] === undefined) delete mark[id];
  save(); go(1);
}

document.getElementById("card").onclick = () => { flipped = !flipped; render(); };
document.getElementById("flip").onclick = e => { e.stopPropagation(); flipped = !flipped; render(); };
document.getElementById("next").onclick = () => go(1);
document.getElementById("prev").onclick = () => go(-1);
document.getElementById("hard").onclick = () => setMark("hard");
document.getElementById("known").onclick = () => setMark("known");
document.getElementById("subjsel").onchange = function () {
  subj = parseInt(this.value, 10) || 0;
  try { localStorage.setItem(SUBJ_KEY, String(subj)); } catch (e) {}
  i = 0; flipped = false; render();
};
document.getElementById("shuffle").onclick = function () {
  for (let k = order.length - 1; k > 0; k--) {
    const j = Math.floor(Math.random() * (k + 1));
    [order[k], order[j]] = [order[j], order[k]];
  }
  i = 0; flipped = false; render();
};
document.getElementById("hardonly").onclick = function () {
  hardOnly = !hardOnly; this.classList.toggle("on", hardOnly);
  i = 0; flipped = false; render();
};
document.getElementById("reset").onclick = function () {
  mark = {}; save(); order = CARDS.slice(); i = 0; flipped = false;
  hardOnly = false; document.getElementById("hardonly").classList.remove("on");
  render();
};
addEventListener("keydown", e => {
  if (e.key === " ") { e.preventDefault(); flipped = !flipped; render(); }
  else if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
});
let tx = 0;
addEventListener("touchstart", e => { tx = e.changedTouches[0].clientX; }, {passive: true});
addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 60) go(dx < 0 ? 1 : -1);
}, {passive: true});

buildSubjectSelect();
render();
</script>
