  <text x="560" y="108" font-size="15" font-weight="800" text-anchor="middle" fill="#0a3d5c">MAC 주소</text>
  <text x="560" y="126" font-size="12" text-anchor="middle" fill="#9aa4ae">AA:BB:CC:11:22:33</text>

