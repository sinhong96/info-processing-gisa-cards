  <text x="360" y="20" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">호스트의 IP 주소를 네트워크 접속 장치의 물리적 주소(MAC)로 변환</text>

  <rect x="50" y="40" width="220" height="90" rx="10" fill="#e8f4fc" stroke="#0b8ad4" stroke-width="2.5"/>
