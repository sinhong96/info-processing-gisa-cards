  <text x="160" y="126" font-size="12" text-anchor="middle" fill="#9aa4ae">192.168.0.1</text>

  <rect x="450" y="40" width="220" height="90" rx="10" fill="#fff3d6" stroke="#e8b33a" stroke-width="2.5"/>
