<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320">
  <rect x="40" y="20" width="120" height="34" fill="#0b8ad4"/>
  <rect x="160" y="20" width="520" height="34" fill="#0b8ad4"/>
  <text x="100" y="43" font-size="14" font-weight="800" text-anchor="middle" fill="#fff">연산자</text>
  <text x="420" y="43" font-size="14" font-weight="800" text-anchor="middle" fill="#fff">의미</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
  <rect x="40" y="54" width="120" height="44" fill="#eef1f4" stroke="#9aa4ae" stroke-width="1"/>
  <rect x="160" y="54" width="520" height="44" fill="#fff" stroke="#9aa4ae" stroke-width="1"/>
  <text x="100" y="82" font-size="15" font-weight="800" text-anchor="middle" fill="#0a3d5c">&amp;</text>

  <rect x="40" y="98" width="120" height="44" fill="#eef1f4" stroke="#9aa4ae" stroke-width="1"/>
  <rect x="160" y="98" width="520" height="44" fill="#fff" stroke="#9aa4ae" stroke-width="1"/>
  <text x="100" y="126" font-size="15" font-weight="800" text-anchor="middle" fill="#0a3d5c">^</text>

  <rect x="40" y="142" width="120" height="44" fill="#eef1f4" stroke="#9aa4ae" stroke-width="1"/>
  <rect x="160" y="142" width="520" height="44" fill="#fff" stroke="#9aa4ae" stroke-width="1"/>
  <text x="100" y="170" font-size="15" font-weight="800" text-anchor="middle" fill="#0a3d5c">|</text>

  <rect x="40" y="186" width="120" height="44" fill="#eef1f4" stroke="#9aa4ae" stroke-width="1"/>
  <rect x="160" y="186" width="520" height="44" fill="#fff" stroke="#9aa4ae" stroke-width="1"/>
  <text x="100" y="214" font-size="15" font-weight="800" text-anchor="middle" fill="#0a3d5c">~</text>

  <rect x="40" y="230" width="120" height="44" fill="#eef1f4" stroke="#9aa4ae" stroke-width="1"/>
  <rect x="160" y="230" width="520" height="44" fill="#fff" stroke="#9aa4ae" stroke-width="1"/>
  <text x="100" y="258" font-size="15" font-weight="800" text-anchor="middle" fill="#0a3d5c">&lt;&lt;</text>

  <rect x="40" y="274" width="120" height="44" fill="#eef1f4" stroke="#9aa4ae" stroke-width="1"/>
  <rect x="160" y="274" width="520" height="44" fill="#fff" stroke="#9aa4ae" stroke-width="1"/>
  <text x="100" y="302" font-size="15" font-weight="800" text-anchor="middle" fill="#0a3d5c">&gt;&gt;</text>
  </g>

  <text x="420" y="76" font-size="12" text-anchor="middle" fill="#1a1a1a">(and) : 모든 비트가</text>
  <text x="420" y="92" font-size="12" text-anchor="middle" fill="#1a1a1a">1일 때만 1</text>

  <text x="420" y="120" font-size="12" text-anchor="middle" fill="#1a1a1a">(xor) : 모든 비트가 같으면 0,</text>
  <text x="420" y="136" font-size="12" text-anchor="middle" fill="#1a1a1a">하나라도 다르면 1</text>

  <text x="420" y="164" font-size="12" text-anchor="middle" fill="#1a1a1a">(or) : 모든 비트 중</text>
  <text x="420" y="180" font-size="12" text-anchor="middle" fill="#1a1a1a">한 비트라도 1이면 1</text>

  <text x="420" y="208" font-size="12" text-anchor="middle" fill="#1a1a1a">(not) : 각 비트의 부정,</text>
  <text x="420" y="224" font-size="12" text-anchor="middle" fill="#1a1a1a">0이면 1, 1이면 0</text>

  <text x="420" y="256" font-size="12" text-anchor="middle" fill="#1a1a1a">(왼쪽 시프트) :</text>
  <text x="420" y="272" font-size="12" text-anchor="middle" fill="#1a1a1a">비트를 왼쪽으로 이동</text>

  <text x="420" y="300" font-size="12" text-anchor="middle" fill="#1a1a1a">(오른쪽 시프트) :</text>
  <text x="420" y="316" font-size="12" text-anchor="middle" fill="#1a1a1a">비트를 오른쪽으로 이동</text>

  <rect x="40" y="20" width="640" height="298" fill="none" stroke="#9aa4ae" stroke-width="1.5"/>
  <line x1="160" y1="20" x2="160" y2="318" stroke="#0b8ad4" stroke-width="2"/>
</svg>
