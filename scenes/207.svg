<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190">
  <text x="360" y="24" font-size="13" fill="#9aa4ae" text-anchor="middle">32비트 = 8비트 × 4부분</text>
  <rect x="60" y="40" width="140" height="40" fill="#e8f4fc" stroke="#0b8ad4" stroke-width="2"/>
  <text x="130" y="65" font-size="13" font-weight="800" text-anchor="middle" fill="#0a3d5c" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">8비트</text>
  <rect x="200" y="40" width="140" height="40" fill="#e8f4fc" stroke="#0b8ad4" stroke-width="2"/>
  <text x="270" y="65" font-size="13" font-weight="800" text-anchor="middle" fill="#0a3d5c" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">8비트</text>
  <rect x="340" y="40" width="140" height="40" fill="#e8f4fc" stroke="#0b8ad4" stroke-width="2"/>
  <text x="410" y="65" font-size="13" font-weight="800" text-anchor="middle" fill="#0a3d5c" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">8비트</text>
  <rect x="480" y="40" width="140" height="40" fill="#e8f4fc" stroke="#0b8ad4" stroke-width="2"/>
  <text x="550" y="65" font-size="13" font-weight="800" text-anchor="middle" fill="#0a3d5c" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">8비트</text>

  <text x="360" y="112" font-size="12.5" text-anchor="middle" fill="#4a5560" font-weight="700">A 클래스 ~ E 클래스, 총 5단계로 구성</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="800">
  <rect x="60" y="128" width="110" height="38" rx="6" fill="#e8f4fc" stroke="#0b8ad4" stroke-width="2"/>
  <text x="115" y="153" text-anchor="middle" fill="#0a3d5c">A</text>
  <rect x="182" y="128" width="110" height="38" rx="6" fill="#e8f4fc" stroke="#0b8ad4" stroke-width="2"/>
  <text x="237" y="153" text-anchor="middle" fill="#0a3d5c">B</text>
  <rect x="304" y="128" width="110" height="38" rx="6" fill="#e8f4fc" stroke="#0b8ad4" stroke-width="2"/>
  <text x="359" y="153" text-anchor="middle" fill="#0a3d5c">C</text>
  <rect x="426" y="128" width="110" height="38" rx="6" fill="#fff3d6" stroke="#e8b33a" stroke-width="2"/>
  <text x="481" y="153" text-anchor="middle" fill="#7a4f00">D</text>
  <rect x="548" y="128" width="110" height="38" rx="6" fill="#fff3d6" stroke="#e8b33a" stroke-width="2"/>
  <text x="603" y="153" text-anchor="middle" fill="#7a4f00">E</text>
  </g>
</svg>
