<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280">
  <rect x="30" y="14" width="140" height="34" fill="#0b8ad4"/>
  <rect x="170" y="14" width="520" height="34" fill="#0b8ad4"/>
  <text x="100" y="37" font-size="14" font-weight="800" text-anchor="middle" fill="#fff">장비</text>
  <text x="430" y="37" font-size="14" font-weight="800" text-anchor="middle" fill="#fff">설명</text>

  <rect x="30" y="48" width="140" height="40" fill="#eef1f4" stroke="#9aa4ae" stroke-width="1"/>
  <rect x="170" y="48" width="520" height="40" fill="#fff" stroke="#9aa4ae" stroke-width="1"/>
  <text x="100" y="73" font-size="13" font-weight="800" text-anchor="middle" fill="#0a3d5c">리피터</text>
  <text x="190" y="73" font-size="12.5" fill="#1a1a1a">원래의 신호 형태로 재생하여 다시 전송함</text>

  <rect x="30" y="88" width="140" height="40" fill="#eef1f4" stroke="#9aa4ae" stroke-width="1"/>
  <rect x="170" y="88" width="520" height="40" fill="#fff" stroke="#9aa4ae" stroke-width="1"/>
  <text x="100" y="113" font-size="13" font-weight="800" text-anchor="middle" fill="#0a3d5c">브리지</text>
  <text x="190" y="113" font-size="12.5" fill="#1a1a1a">LAN과 LAN을 연결하거나 LAN 안 컴퓨터 그룹을 연결함</text>

  <rect x="30" y="128" width="140" height="40" fill="#eef1f4" stroke="#9aa4ae" stroke-width="1"/>
  <rect x="170" y="128" width="520" height="40" fill="#fff" stroke="#9aa4ae" stroke-width="1"/>
  <text x="100" y="153" font-size="13" font-weight="800" text-anchor="middle" fill="#0a3d5c">라우터</text>
  <text x="190" y="153" font-size="12.5" fill="#1a1a1a">데이터 전송의 최적 경로를 선택함</text>

  <rect x="30" y="168" width="140" height="40" fill="#eef1f4" stroke="#9aa4ae" stroke-width="1"/>
  <rect x="170" y="168" width="520" height="40" fill="#fff" stroke="#9aa4ae" stroke-width="1"/>
  <text x="100" y="193" font-size="13" font-weight="800" text-anchor="middle" fill="#0a3d5c">스위치</text>
  <text x="190" y="193" font-size="12.5" fill="#1a1a1a">LAN과 LAN을 연결해 더 큰 LAN을 만드는 장치</text>

  <rect x="30" y="208" width="140" height="58" fill="#eef1f4" stroke="#9aa4ae" stroke-width="1"/>
  <rect x="170" y="208" width="520" height="58" fill="#fff" stroke="#9aa4ae" stroke-width="1"/>
  <text x="100" y="242" font-size="13" font-weight="800" text-anchor="middle" fill="#0a3d5c">브라우터</text>
  <text x="190" y="230" font-size="12.5" fill="#1a1a1a">브리지+라우터 기능을 모두 수행 : 브리지 기능은 내부</text>
  <text x="190" y="250" font-size="12.5" fill="#1a1a1a">망 분리, 라우터 기능은 외부 망 연결에 사용함</text>

  <rect x="30" y="14" width="660" height="252" fill="none" stroke="#9aa4ae" stroke-width="1.5"/>
  <line x1="170" y1="14" x2="170" y2="266" stroke="#0b8ad4" stroke-width="2"/>
</svg>
