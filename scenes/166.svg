<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210">
  <rect x="40" y="20" width="120" height="34" fill="#0b8ad4"/>
  <rect x="160" y="20" width="520" height="34" fill="#0b8ad4"/>
  <text x="100" y="43" font-size="14" font-weight="800" text-anchor="middle" fill="#fff">연산자</text>
  <text x="420" y="43" font-size="14" font-weight="800" text-anchor="middle" fill="#fff">의미</text>

  <rect x="40" y="54" width="120" height="50" fill="#eef1f4" stroke="#9aa4ae" stroke-width="1"/>
  <rect x="160" y="54" width="520" height="50" fill="#fff" stroke="#9aa4ae" stroke-width="1"/>
  <text x="100" y="86" font-size="16" font-weight="800" text-anchor="middle" fill="#0a3d5c" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">!</text>
  <text x="420" y="86" font-size="13" text-anchor="middle" fill="#1a1a1a">(not) : 부정</text>

  <rect x="40" y="104" width="120" height="50" fill="#eef1f4" stroke="#9aa4ae" stroke-width="1"/>
  <rect x="160" y="104" width="520" height="50" fill="#fff" stroke="#9aa4ae" stroke-width="1"/>
  <text x="100" y="136" font-size="16" font-weight="800" text-anchor="middle" fill="#0a3d5c" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">&amp;&amp;</text>
  <text x="420" y="136" font-size="13" text-anchor="middle" fill="#1a1a1a">(and) : 모두 참이면 참</text>

  <rect x="40" y="154" width="120" height="50" fill="#eef1f4" stroke="#9aa4ae" stroke-width="1"/>
  <rect x="160" y="154" width="520" height="50" fill="#fff" stroke="#9aa4ae" stroke-width="1"/>
  <text x="100" y="186" font-size="16" font-weight="800" text-anchor="middle" fill="#0a3d5c" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">||</text>
  <text x="420" y="186" font-size="13" text-anchor="middle" fill="#1a1a1a">(or) : 하나라도 참이면 참</text>

  <rect x="40" y="20" width="640" height="184" fill="none" stroke="#9aa4ae" stroke-width="1.5"/>
  <line x1="160" y1="20" x2="160" y2="204" stroke="#0b8ad4" stroke-width="2"/>
</svg>
