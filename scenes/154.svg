<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210">
  <text x="360" y="22" font-size="12.5" fill="#9aa4ae" text-anchor="middle">대표 문자를 이용해 지정된 속성의 값이 문자 패턴과 일치하는 튜플을 검색</text>

  <circle cx="130" cy="98" r="46" fill="#e8f4fc" stroke="#0b8ad4" stroke-width="2.5"/>
  <text x="130" y="90" font-size="24" font-weight="800" text-anchor="middle" fill="#0a3d5c" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">%</text>
  <text x="130" y="112" font-size="11.5" text-anchor="middle" fill="#1a1a1a" font-weight="700">모든 문자</text>

  <circle cx="290" cy="98" r="46" fill="#fff3d6" stroke="#e8b33a" stroke-width="2.5"/>
  <text x="290" y="90" font-size="24" font-weight="800" text-anchor="middle" fill="#7a4f00" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">_</text>
  <text x="290" y="112" font-size="11.5" text-anchor="middle" fill="#1a1a1a" font-weight="700">문자 하나</text>

  <circle cx="450" cy="98" r="46" fill="#e8f4fc" stroke="#0b8ad4" stroke-width="2.5"/>
  <text x="450" y="90" font-size="24" font-weight="800" text-anchor="middle" fill="#0a3d5c" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">#</text>
  <text x="450" y="112" font-size="11.5" text-anchor="middle" fill="#1a1a1a" font-weight="700">숫자 하나</text>

  <text x="600" y="90" font-size="34" text-anchor="middle">🔍</text>
  <text x="600" y="122" font-size="12" font-weight="700" text-anchor="middle" fill="#9aa4ae" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">LIKE</text>

  <rect x="40" y="168" width="640" height="30" rx="6" fill="#eef1f4" stroke="#9aa4ae" stroke-width="1.5"/>
  <text x="360" y="188" font-size="12.5" text-anchor="middle" fill="#1a1a1a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">WHERE 이름 LIKE '김%'</text>
</svg>
