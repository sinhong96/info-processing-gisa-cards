<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270">
  <rect x="24" y="8"   width="672" height="46" rx="8" fill="#e8f4fc" stroke="#0b8ad4" stroke-width="2"/>
  <text x="44" y="30" font-size="13.5" font-weight="800" fill="#0a3d5c">클리어링 하우스</text>
