  <text x="44" y="150" font-size="11.5" fill="#1a1a1a">콘텐츠를 메타데이터와 함께 배포 형태로 묶어 암호화하는 프로그램</text>

  <rect x="24" y="164" width="672" height="46" rx="8" fill="#eef1f4" stroke="#9aa4ae" stroke-width="2"/>
