  <text x="44" y="98" font-size="11.5" fill="#1a1a1a">콘텐츠를 제공하는 저작권자</text>

  <rect x="24" y="112" width="672" height="46" rx="8" fill="#e8f4fc" stroke="#0b8ad4" stroke-width="2"/>
