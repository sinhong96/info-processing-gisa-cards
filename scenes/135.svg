<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 274">
  <rect x="20" y="16" width="680" height="238" fill="none" stroke="#9aa4ae" stroke-width="1.5"/>
  <line x1="200" y1="16" x2="200" y2="254" stroke="#0b8ad4" stroke-width="2"/>
  <line x1="20" y1="64" x2="700" y2="64" stroke="#9aa4ae" stroke-width="1"/>
  <line x1="20" y1="112" x2="700" y2="112" stroke="#9aa4ae" stroke-width="1"/>
  <line x1="20" y1="160" x2="700" y2="160" stroke="#9aa4ae" stroke-width="1"/>
  <line x1="20" y1="208" x2="700" y2="208" stroke="#9aa4ae" stroke-width="1"/>

  <rect x="200" y="16" width="500" height="48" fill="#fff"/>
  <rect x="20" y="16" width="180" height="48" fill="#e8f4fc"/>
  <text x="46" y="46" font-size="20" text-anchor="middle">📏</text>
  <text x="120" y="46" font-size="13" font-weight="800" text-anchor="middle" fill="#0a3d5c">범위 분할</text>
  <text x="230" y="38" font-size="12" fill="#1a1a1a">지정한 열의 값을 기준으로 범위를 지정하여 분할함</text>
  <text x="230" y="56" font-size="11.5" fill="#9aa4ae">(예 : 일별, 월별, 분기별 등)</text>

  <rect x="200" y="64" width="500" height="48" fill="#fff"/>
  <rect x="20" y="64" width="180" height="48" fill="#fff3d6"/>
  <text x="46" y="94" font-size="20" text-anchor="middle">#️⃣</text>
  <text x="120" y="94" font-size="13" font-weight="800" text-anchor="middle" fill="#7a4f00">해시 분할</text>
  <text x="230" y="92" font-size="12" fill="#1a1a1a">해시 함수를 적용한 결과 값에 따라 데이터를 분할함</text>

  <rect x="200" y="112" width="500" height="48" fill="#fff"/>
  <rect x="20" y="112" width="180" height="48" fill="#e8f4fc"/>
  <text x="46" y="142" font-size="20" text-anchor="middle">🧩</text>
  <text x="120" y="142" font-size="13" font-weight="800" text-anchor="middle" fill="#0a3d5c">조합 분할</text>
  <text x="230" y="134" font-size="12" fill="#1a1a1a">범위 분할로 분할한 다음 해시 함수를 적용하여</text>
  <text x="230" y="152" font-size="12" fill="#1a1a1a">다시 분할하는 방식</text>

  <rect x="200" y="160" width="500" height="48" fill="#fff"/>
  <rect x="20" y="160" width="180" height="48" fill="#fff3d6"/>
  <text x="46" y="190" font-size="20" text-anchor="middle">📋</text>
  <text x="120" y="190" font-size="13" font-weight="800" text-anchor="middle" fill="#7a4f00">목록 분할</text>
  <text x="230" y="182" font-size="12" fill="#1a1a1a">지정한 열 값에 대한 목록을 만들어</text>
  <text x="230" y="200" font-size="12" fill="#1a1a1a">이를 기준으로 분할함</text>

  <rect x="200" y="208" width="500" height="46" fill="#fff"/>
  <rect x="20" y="208" width="180" height="46" fill="#e8f4fc"/>
  <text x="46" y="236" font-size="20" text-anchor="middle">🔄</text>
  <text x="120" y="234" font-size="12.5" font-weight="800" text-anchor="middle" fill="#0a3d5c">라운드 로빈 분할</text>
  <text x="230" y="236" font-size="12" fill="#1a1a1a">레코드를 균일하게 분배하는 방식</text>
</svg>
