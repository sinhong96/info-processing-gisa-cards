<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 216">
  <text x="360" y="24" font-size="12.5" fill="#9aa4ae" text-anchor="middle">테이블에 대한 정의를 변경하는 명령문</text>

  <rect x="30" y="42" width="100" height="46" rx="8" fill="#e8f4fc" stroke="#0b8ad4" stroke-width="2"/>
  <text x="80" y="70" font-size="14" font-weight="800" text-anchor="middle" fill="#0a3d5c" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">ADD</text>
  <rect x="140" y="42" width="550" height="46" rx="6" fill="#eef1f4" stroke="#9aa4ae" stroke-width="1.5"/>
  <text x="160" y="70" font-size="12" fill="#1a1a1a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">ALTER TABLE 테이블명 ADD 속성명 데이터_타입 [DEFAULT '기본값'];</text>

  <rect x="30" y="98" width="100" height="46" rx="8" fill="#fff3d6" stroke="#e8b33a" stroke-width="2"/>
  <text x="80" y="126" font-size="14" font-weight="800" text-anchor="middle" fill="#7a4f00" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">ALTER</text>
  <rect x="140" y="98" width="550" height="46" rx="6" fill="#eef1f4" stroke="#9aa4ae" stroke-width="1.5"/>
  <text x="160" y="126" font-size="12" fill="#1a1a1a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">ALTER TABLE 테이블명 ALTER 속성명 [SET DEFAULT '기본값'];</text>

  <rect x="30" y="154" width="100" height="46" rx="8" fill="#fdeaea" stroke="#e03131" stroke-width="2"/>
  <text x="80" y="176" font-size="12.5" font-weight="800" text-anchor="middle" fill="#7a1414" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">DROP</text>
  <text x="80" y="192" font-size="11" font-weight="700" text-anchor="middle" fill="#7a1414" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">COLUMN</text>
  <rect x="140" y="154" width="550" height="46" rx="6" fill="#eef1f4" stroke="#9aa4ae" stroke-width="1.5"/>
  <text x="160" y="182" font-size="12" fill="#1a1a1a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">ALTER TABLE 테이블명 DROP COLUMN 속성명 [CASCADE];</text>
</svg>
