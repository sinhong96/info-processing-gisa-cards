<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190">
  <rect x="30" y="20" width="150" height="140" fill="#0b8ad4"/>
  <rect x="180" y="20" width="510" height="140" fill="#eef1f4" stroke="#9aa4ae" stroke-width="1.5"/>
  <line x1="30" y1="90" x2="690" y2="90" stroke="#9aa4ae" stroke-width="1.5"/>
  <line x1="30" y1="20" x2="30" y2="160" stroke="#9aa4ae" stroke-width="1.5"/>
  <line x1="690" y1="20" x2="690" y2="160" stroke="#9aa4ae" stroke-width="1.5"/>
  <line x1="30" y1="160" x2="690" y2="160" stroke="#9aa4ae" stroke-width="1.5"/>
  <line x1="180" y1="20" x2="180" y2="160" stroke="#0b8ad4" stroke-width="2"/>

  <text x="105" y="42" font-size="15" font-weight="800" text-anchor="middle" fill="#fff">복잡도</text>
  <text x="105" y="60" font-size="20" font-weight="800" text-anchor="middle" fill="#fff">O(1)</text>
  <text x="200" y="42" font-size="13" fill="#1a1a1a" font-weight="700">입력값(n)에 관계없이 일정, 문제 해결에 하나의</text>
  <text x="200" y="60" font-size="13" fill="#1a1a1a" font-weight="700">단계만을 거침</text>
  <text x="200" y="80" font-size="12" fill="#9aa4ae">예 : 스택의 삽입(Push), 삭제(Pop)</text>

  <text x="105" y="112" font-size="15" font-weight="800" text-anchor="middle" fill="#fff">복잡도</text>
  <text x="105" y="132" font-size="18" font-weight="800" text-anchor="middle" fill="#fff">O(nlog2n)</text>
  <text x="200" y="112" font-size="13" fill="#1a1a1a" font-weight="700">문제 해결에 필요한 단계가 n(log2n)번만큼</text>
  <text x="200" y="130" font-size="13" fill="#1a1a1a" font-weight="700">수행됨</text>
  <text x="200" y="150" font-size="12" fill="#9aa4ae">예 : 힙 정렬(Heap Sort), 2-Way 합병 정렬(Merge Sort)</text>

  <rect x="30" y="20" width="150" height="140" fill="none" stroke="#0b8ad4" stroke-width="2"/>
</svg>
