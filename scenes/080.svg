<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210">
  <text x="360" y="20" font-size="13" text-anchor="middle" fill="#9aa4ae">전체 모듈의 20% 안에서 오류의 80%가 발견된다</text>

  <text x="235" y="42" font-size="13" font-weight="800" text-anchor="middle" fill="#0a3d5c">전체 모듈</text>
  <rect x="200" y="50" width="70" height="92"  fill="#eef1f4" stroke="#9aa4ae" stroke-width="2"/>
  <rect x="200" y="142" width="70" height="28" fill="#e8f4fc" stroke="#0b8ad4" stroke-width="2.5"/>
  <text x="235" y="100" font-size="13" text-anchor="middle" fill="#9aa4ae">80%</text>
  <text x="235" y="160" font-size="14" font-weight="800" text-anchor="middle" fill="#0a3d5c">20%</text>

  <polygon points="270,142 460,58 460,170 270,170" fill="#0b8ad4" opacity=".18"/>

  <text x="495" y="42" font-size="13" font-weight="800" text-anchor="middle" fill="#0a3d5c">발견된 오류</text>
  <rect x="460" y="50" width="70" height="8"   fill="#eef1f4" stroke="#9aa4ae" stroke-width="2"/>
  <rect x="460" y="58" width="70" height="112" fill="#e8f4fc" stroke="#0b8ad4" stroke-width="2.5"/>
  <text x="495" y="46" font-size="11" text-anchor="middle" fill="#9aa4ae">20%</text>
  <text x="495" y="120" font-size="16" font-weight="800" text-anchor="middle" fill="#0a3d5c">80%</text>

  <text x="360" y="196" font-size="14" font-weight="800" text-anchor="middle" fill="#e03131">오류의 80% ≒ 모듈의 20%</text>
</svg>
