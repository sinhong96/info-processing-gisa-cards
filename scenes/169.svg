<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 170">
  <rect x="40" y="20" width="100" height="34" fill="#0b8ad4"/>
  <rect x="140" y="20" width="540" height="34" fill="#0b8ad4"/>
  <text x="90" y="43" font-size="14" font-weight="800" text-anchor="middle" fill="#fff">서식</text>
  <text x="410" y="43" font-size="14" font-weight="800" text-anchor="middle" fill="#fff">설명</text>

  <rect x="40" y="54" width="100" height="42" fill="#eef1f4" stroke="#9aa4ae" stroke-width="1"/>
  <rect x="140" y="54" width="540" height="42" fill="#fff" stroke="#9aa4ae" stroke-width="1"/>
  <text x="90" y="80" font-size="16" font-weight="800" text-anchor="middle" fill="#0a3d5c" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">%d</text>
  <text x="160" y="80" font-size="13" fill="#1a1a1a">정수형 10진수를 입·출력하기 위해 지정함</text>

  <rect x="40" y="96" width="100" height="42" fill="#eef1f4" stroke="#9aa4ae" stroke-width="1"/>
  <rect x="140" y="96" width="540" height="42" fill="#fff" stroke="#9aa4ae" stroke-width="1"/>
  <text x="90" y="122" font-size="16" font-weight="800" text-anchor="middle" fill="#0a3d5c" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">%c</text>
  <text x="160" y="122" font-size="13" fill="#1a1a1a">문자를 입·출력하기 위해 지정함</text>

  <rect x="40" y="138" width="100" height="42" fill="#eef1f4" stroke="#9aa4ae" stroke-width="1"/>
  <rect x="140" y="138" width="540" height="42" fill="#fff" stroke="#9aa4ae" stroke-width="1"/>
  <text x="90" y="164" font-size="16" font-weight="800" text-anchor="middle" fill="#0a3d5c" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">%s</text>
  <text x="160" y="164" font-size="13" fill="#1a1a1a">문자열을 입·출력하기 위해 지정함</text>

  <rect x="40" y="20" width="640" height="160" fill="none" stroke="#9aa4ae" stroke-width="1.5"/>
  <line x1="140" y1="20" x2="140" y2="180" stroke="#0b8ad4" stroke-width="2"/>
</svg>
