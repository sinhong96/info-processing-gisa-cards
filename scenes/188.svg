<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260">
  <text x="360" y="26" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">a = ['a', 'b', 'c', 'd', 'e']</text>

  <rect x="40" y="42" width="220" height="34" fill="#0b8ad4"/>
  <rect x="260" y="42" width="420" height="34" fill="#0b8ad4"/>
  <text x="150" y="65" font-size="14" font-weight="800" text-anchor="middle" fill="#fff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">표현식</text>
  <text x="470" y="65" font-size="14" font-weight="800" text-anchor="middle" fill="#fff">결과</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">
  <rect x="40" y="76" width="220" height="36" fill="#eef1f4" stroke="#9aa4ae" stroke-width="1"/>
  <rect x="260" y="76" width="420" height="36" fill="#fff" stroke="#9aa4ae" stroke-width="1"/>
  <text x="150" y="100" text-anchor="middle" fill="#0a3d5c">a[1:3]</text>
  <text x="470" y="100" text-anchor="middle" fill="#1a1a1a">['b', 'c']</text>

  <rect x="40" y="112" width="220" height="36" fill="#eef1f4" stroke="#9aa4ae" stroke-width="1"/>
  <rect x="260" y="112" width="420" height="36" fill="#fff" stroke="#9aa4ae" stroke-width="1"/>
  <text x="150" y="136" text-anchor="middle" fill="#0a3d5c">a[0:5:2]</text>
  <text x="470" y="136" text-anchor="middle" fill="#1a1a1a">['a', 'c', 'e']</text>

  <rect x="40" y="148" width="220" height="36" fill="#eef1f4" stroke="#9aa4ae" stroke-width="1"/>
  <rect x="260" y="148" width="420" height="36" fill="#fff" stroke="#9aa4ae" stroke-width="1"/>
  <text x="150" y="172" text-anchor="middle" fill="#0a3d5c">a[3:]</text>
  <text x="470" y="172" text-anchor="middle" fill="#1a1a1a">['d', 'e']</text>

  <rect x="40" y="184" width="220" height="36" fill="#eef1f4" stroke="#9aa4ae" stroke-width="1"/>
  <rect x="260" y="184" width="420" height="36" fill="#fff" stroke="#9aa4ae" stroke-width="1"/>
  <text x="150" y="208" text-anchor="middle" fill="#0a3d5c">a[:3]</text>
  <text x="470" y="208" text-anchor="middle" fill="#1a1a1a">['a', 'b', 'c']</text>

  <rect x="40" y="220" width="220" height="36" fill="#eef1f4" stroke="#9aa4ae" stroke-width="1"/>
  <rect x="260" y="220" width="420" height="36" fill="#fff" stroke="#9aa4ae" stroke-width="1"/>
  <text x="150" y="244" text-anchor="middle" fill="#0a3d5c">a[::3]</text>
  <text x="470" y="244" text-anchor="middle" fill="#1a1a1a">['a', 'd']</text>
  </g>

  <rect x="40" y="42" width="640" height="214" fill="none" stroke="#9aa4ae" stroke-width="1.5"/>
  <line x1="260" y1="42" x2="260" y2="256" stroke="#0b8ad4" stroke-width="2"/>
</svg>
