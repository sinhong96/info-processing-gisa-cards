<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230">
  <rect x="150" y="14" width="420" height="34" rx="8" fill="#eef1f4" stroke="#9aa4ae" stroke-width="1.5"/>
  <text x="360" y="37" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1a1a1a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">a = [ 10, 'mike', 23.45 ]</text>

  <text x="230" y="76" font-size="11.5" text-anchor="middle" fill="#9aa4ae" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">a[0]</text>
  <text x="330" y="76" font-size="11.5" text-anchor="middle" fill="#9aa4ae" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">a[1]</text>
  <text x="430" y="76" font-size="11.5" text-anchor="middle" fill="#9aa4ae" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">a[2]</text>

  <text x="130" y="112" font-size="14" font-weight="800" fill="#0a3d5c">리스트 a</text>
  <rect x="195" y="86" width="70" height="50" rx="6" fill="#e8f4fc" stroke="#0b8ad4" stroke-width="2.5"/>
  <text x="230" y="118" font-size="16" font-weight="800" text-anchor="middle" fill="#0a3d5c" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">10</text>
  <rect x="295" y="86" width="70" height="50" rx="6" fill="#fff3d6" stroke="#e8b33a" stroke-width="2.5"/>
  <text x="330" y="118" font-size="14" font-weight="800" text-anchor="middle" fill="#7a4f00" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">'mike'</text>
  <rect x="395" y="86" width="70" height="50" rx="6" fill="#e8f4fc" stroke="#0b8ad4" stroke-width="2.5"/>
  <text x="430" y="118" font-size="15" font-weight="800" text-anchor="middle" fill="#0a3d5c" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">23.45</text>

  <text x="360" y="160" font-size="12" text-anchor="middle" fill="#9aa4ae">서로 다른 자료형을 함께 저장할 수 있음 · 크기 선언 없음</text>

  <rect x="90" y="182" width="200" height="30" rx="6" fill="#eef1f4" stroke="#9aa4ae" stroke-width="1.5"/>
  <text x="190" y="202" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">a[0] = 1</text>
  <text x="440" y="202" font-size="12.5" text-anchor="middle" fill="#4a5560">→ a[0]의 값이 10에서 1로 바뀜</text>
