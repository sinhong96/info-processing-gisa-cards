<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210">
  <text x="360" y="20" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="700">전력선을 기반으로 통신·정보·애플리케이션 인프라를 하나로 통합</text>

  <rect x="50" y="70" width="620" height="14" rx="4" fill="#e8b33a"/>
  <text x="60" y="66" font-size="11" fill="#9aa4ae" font-weight="700">⚡ 전력선</text>

  <line x1="150" y1="84" x2="150" y2="108" stroke="#9aa4ae" stroke-width="2"/>
  <line x1="330" y1="84" x2="330" y2="108" stroke="#9aa4ae" stroke-width="2"/>
  <line x1="510" y1="84" x2="510" y2="108" stroke="#9aa4ae" stroke-width="2"/>

  <rect x="80" y="108" width="140" height="70" rx="8" fill="#e8f4fc" stroke="#0b8ad4" stroke-width="2"/>
  <text x="150" y="140" font-size="24" text-anchor="middle">📡</text>
  <text x="150" y="164" font-size="11" font-weight="700" text-anchor="middle" fill="#0a3d5c">통신 인프라</text>

  <rect x="260" y="108" width="140" height="70" rx="8" fill="#e8f4fc" stroke="#0b8ad4" stroke-width="2"/>
  <text x="330" y="140" font-size="24" text-anchor="middle">📊</text>
  <text x="330" y="164" font-size="11" font-weight="700" text-anchor="middle" fill="#0a3d5c">정보 인프라</text>

  <rect x="440" y="108" width="140" height="70" rx="8" fill="#e8f4fc" stroke="#0b8ad4" stroke-width="2"/>
  <text x="510" y="140" font-size="24" text-anchor="middle">📱</text>
  <text x="510" y="164" font-size="11" font-weight="700" text-anchor="middle" fill="#0a3d5c">애플리케이션</text>

  <text x="360" y="200" font-size="12" text-anchor="middle" fill="#1a1a1a" font-weight="700">하나의 시스템으로 관리 → 효율적인 에너지 관리</text>
</svg>
