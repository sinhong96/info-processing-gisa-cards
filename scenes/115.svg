<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210">
  <rect x="24" y="16" width="326" height="178" rx="10" fill="#e8f4fc" stroke="#0b8ad4" stroke-width="2.5"/>
  <text x="187" y="46" font-size="16" font-weight="800" text-anchor="middle" fill="#0a3d5c">개체 무결성</text>
  <text x="187" y="64" font-size="11" text-anchor="middle" fill="#0b8ad4">기본키(PK) 규정</text>
  <text x="60" y="94" font-size="12" fill="#1a1a1a">기본 테이블의 기본키를</text>
  <text x="60" y="114" font-size="12" fill="#1a1a1a">구성하는 어떤 속성도</text>
  <rect x="50" y="128" width="260" height="46" rx="6" fill="#fff"/>
  <text x="180" y="148" font-size="12" font-weight="700" text-anchor="middle" fill="#e03131">Null ❌ / 중복값 ❌</text>
  <text x="180" y="166" font-size="11" text-anchor="middle" fill="#4a5560">가질 수 없다</text>

  <rect x="370" y="16" width="326" height="178" rx="10" fill="#fff3d6" stroke="#e8b33a" stroke-width="2.5"/>
  <text x="533" y="46" font-size="16" font-weight="800" text-anchor="middle" fill="#0a3d5c">참조 무결성</text>
  <text x="533" y="64" font-size="11" text-anchor="middle" fill="#7a4f00">외래키(FK) 규정</text>
  <text x="406" y="94" font-size="12" fill="#1a1a1a">외래키 값은 Null이거나</text>
  <text x="406" y="114" font-size="12" fill="#1a1a1a">참조 릴레이션의 기본키 값과</text>
  <rect x="396" y="128" width="260" height="46" rx="6" fill="#fff"/>
  <text x="526" y="150" font-size="12" font-weight="700" text-anchor="middle" fill="#0b8ad4">동일해야 한다</text>
  <text x="526" y="166" font-size="10" text-anchor="middle" fill="#4a5560">참조할 수 없는 FK값은 가질 수 없음</text>
</svg>
