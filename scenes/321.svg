  <rect x="40" y="10" width="640" height="200" rx="10" fill="#0a3d5c"/>
  <rect x="40" y="10" width="640" height="34" rx="10" fill="#4a5560"/>
  <rect x="40" y="27" width="640" height="17" fill="#4a5560"/>
