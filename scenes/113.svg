<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270">
  <circle cx="220" cy="130" r="105" fill="#e8f4fc" stroke="#0b8ad4" stroke-width="3"/>
  <text x="220" y="42" font-size="13" font-weight="800" text-anchor="middle" fill="#0a3d5c">슈퍼키</text>

  <circle cx="200" cy="140" r="75" fill="none" stroke="#9aa4ae" stroke-width="1.5"/>
  <text x="200" y="82" font-size="12" text-anchor="middle" fill="#9aa4ae">후보키</text>

  <circle cx="185" cy="155" r="32" fill="none" stroke="#9aa4ae" stroke-width="1.5"/>
  <text x="185" y="159" font-size="11" text-anchor="middle" fill="#9aa4ae">기본키</text>

  <rect x="420" y="40" width="260" height="190" rx="10" fill="#eef1f4" stroke="#9aa4ae" stroke-width="1.5"/>
  <text x="444" y="72" font-size="15" font-weight="800" fill="#0a3d5c">슈퍼키 (Super Key)</text>
  <text x="444" y="100" font-size="12" fill="#1a1a1a">한 릴레이션 내 속성들의 집합으로</text>
