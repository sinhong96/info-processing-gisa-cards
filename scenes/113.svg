  <text x="444" y="150" font-size="13" font-weight="700" fill="#0b8ad4">유일성 ✅ / 최소성 ❌</text>
  <text x="444" y="174" font-size="11" fill="#9aa4ae">유일성은 만족하지만</text>
  <text x="444" y="192" font-size="11" fill="#9aa4ae">최소성은 만족시키지 못한다</text>
