<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210">
  <rect x="20" y="20" width="156" height="170" rx="10" fill="#e8f4fc" stroke="#0b8ad4" stroke-width="2"/>
  <rect x="20" y="20" width="156" height="38" rx="10" fill="#0b8ad4"/>
  <rect x="20" y="40" width="156" height="18" fill="#0b8ad4"/>
  <text x="98" y="45" font-size="14" font-weight="800" text-anchor="middle" fill="#fff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">UNION</text>
  <text x="98" y="90" font-size="24" text-anchor="middle">🔗</text>
  <text x="98" y="122" font-size="11.5" text-anchor="middle" fill="#0a3d5c" font-weight="700">두 조회 결과를 통합하여</text>
  <text x="98" y="140" font-size="11.5" text-anchor="middle" fill="#0a3d5c" font-weight="700">모두 출력하되, 중복된</text>
  <text x="98" y="158" font-size="11.5" text-anchor="middle" fill="#0a3d5c" font-weight="700">행은 한 번만 출력함</text>

  <rect x="196" y="20" width="156" height="170" rx="10" fill="#fff3d6" stroke="#e8b33a" stroke-width="2"/>
  <rect x="196" y="20" width="156" height="38" rx="10" fill="#e8b33a"/>
  <rect x="196" y="40" width="156" height="18" fill="#e8b33a"/>
  <text x="274" y="45" font-size="13" font-weight="800" text-anchor="middle" fill="#fff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">UNION ALL</text>
  <text x="274" y="90" font-size="24" text-anchor="middle">📚</text>
  <text x="274" y="122" font-size="11.5" text-anchor="middle" fill="#7a4f00" font-weight="700">두 조회 결과를 통합하여</text>
  <text x="274" y="140" font-size="11.5" text-anchor="middle" fill="#7a4f00" font-weight="700">모두 출력하되, 중복된</text>
  <text x="274" y="158" font-size="11.5" text-anchor="middle" fill="#7a4f00" font-weight="700">행도 그대로 출력함</text>

  <rect x="372" y="20" width="156" height="170" rx="10" fill="#e8f4fc" stroke="#0b8ad4" stroke-width="2"/>
  <rect x="372" y="20" width="156" height="38" rx="10" fill="#0b8ad4"/>
  <rect x="372" y="40" width="156" height="18" fill="#0b8ad4"/>
  <text x="450" y="45" font-size="13" font-weight="800" text-anchor="middle" fill="#fff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">INTERSECT</text>
  <text x="450" y="90" font-size="24" text-anchor="middle">🎯</text>
  <text x="450" y="130" font-size="11.5" text-anchor="middle" fill="#0a3d5c" font-weight="700">두 조회 결과 중</text>
  <text x="450" y="148" font-size="11.5" text-anchor="middle" fill="#0a3d5c" font-weight="700">공통된 행만 출력함</text>

  <rect x="548" y="20" width="152" height="170" rx="10" fill="#fff3d6" stroke="#e8b33a" stroke-width="2"/>
  <rect x="548" y="20" width="152" height="38" rx="10" fill="#e8b33a"/>
  <rect x="548" y="40" width="152" height="18" fill="#e8b33a"/>
  <text x="624" y="45" font-size="14" font-weight="800" text-anchor="middle" fill="#fff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">EXCEPT</text>
  <text x="624" y="90" font-size="24" text-anchor="middle">➖</text>
  <text x="624" y="122" font-size="11.5" text-anchor="middle" fill="#7a4f00" font-weight="700">첫 번째 조회 결과에서</text>
  <text x="624" y="140" font-size="11.5" text-anchor="middle" fill="#7a4f00" font-weight="700">두 번째 조회 결과를</text>
  <text x="624" y="158" font-size="11.5" text-anchor="middle" fill="#7a4f00" font-weight="700">제외한 행을 출력함</text>
</svg>
