<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240">
  <!-- CLI panel -->
  <rect x="24" y="16" width="212" height="200" rx="10" fill="#eef1f4" stroke="#9aa4ae" stroke-width="2"/>
  <rect x="24" y="16" width="212" height="52" rx="10" fill="#4a5560"/>
  <rect x="24" y="44"  width="212" height="24" fill="#4a5560"/>
  <text x="130" y="52"  font-size="20" font-weight="800" text-anchor="middle" fill="#fff">CLI</text>
  <text x="130" y="90"  font-size="32" text-anchor="middle">⌨️</text>
  <text x="130" y="130" font-size="14" font-weight="800" text-anchor="middle" fill="#1a1a1a">Command Line</text>
  <text x="130" y="150" font-size="14" font-weight="800" text-anchor="middle" fill="#1a1a1a">Interface</text>
  <text x="130" y="178" font-size="12" text-anchor="middle" fill="#9aa4ae">명령과 출력이</text>
  <text x="130" y="196" font-size="12" text-anchor="middle" fill="#9aa4ae">텍스트 형태로 이뤄짐</text>

  <!-- GUI panel -->
  <rect x="254" y="16" width="212" height="200" rx="10" fill="#e8f4fc" stroke="#0b8ad4" stroke-width="2"/>
  <rect x="254" y="16" width="212" height="52" rx="10" fill="#0b8ad4"/>
  <rect x="254" y="44"  width="212" height="24" fill="#0b8ad4"/>
  <text x="360" y="52"  font-size="20" font-weight="800" text-anchor="middle" fill="#fff">GUI</text>
  <text x="360" y="90"  font-size="32" text-anchor="middle">🖱️</text>
  <text x="360" y="130" font-size="14" font-weight="800" text-anchor="middle" fill="#0a3d5c">Graphical User</text>
  <text x="360" y="150" font-size="14" font-weight="800" text-anchor="middle" fill="#0a3d5c">Interface</text>
  <text x="360" y="178" font-size="12" text-anchor="middle" fill="#9aa4ae">아이콘·메뉴를 마우스로</text>
  <text x="360" y="196" font-size="12" text-anchor="middle" fill="#9aa4ae">선택하는 그래픽 환경</text>

  <!-- NUI panel -->
  <rect x="484" y="16" width="212" height="200" rx="10" fill="#fff3d6" stroke="#e8b33a" stroke-width="2"/>
  <rect x="484" y="16" width="212" height="52" rx="10" fill="#e8b33a"/>
  <rect x="484" y="44"  width="212" height="24" fill="#e8b33a"/>
  <text x="590" y="52"  font-size="20" font-weight="800" text-anchor="middle" fill="#fff">NUI</text>
  <text x="590" y="90"  font-size="32" text-anchor="middle">🗣️</text>
  <text x="590" y="130" font-size="14" font-weight="800" text-anchor="middle" fill="#0a3d5c">Natural User</text>
  <text x="590" y="150" font-size="14" font-weight="800" text-anchor="middle" fill="#0a3d5c">Interface</text>
  <text x="590" y="178" font-size="12" text-anchor="middle" fill="#9aa4ae">말이나 행동으로</text>
  <text x="590" y="196" font-size="12" text-anchor="middle" fill="#9aa4ae">기기를 조작</text>
</svg>
