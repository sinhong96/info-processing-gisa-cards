<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240">
  <rect x="30" y="14" width="150" height="34" fill="#0b8ad4"/>
  <rect x="180" y="14" width="510" height="34" fill="#0b8ad4"/>
  <text x="105" y="37" font-size="14" font-weight="800" text-anchor="middle" fill="#fff">언어</text>
  <text x="435" y="37" font-size="14" font-weight="800" text-anchor="middle" fill="#fff">설명</text>

  <rect x="30" y="48" width="150" height="38" fill="#eef1f4" stroke="#9aa4ae" stroke-width="1"/>
  <rect x="180" y="48" width="510" height="38" fill="#fff" stroke="#9aa4ae" stroke-width="1"/>
  <text x="105" y="72" font-size="13" font-weight="800" text-anchor="middle" fill="#0a3d5c">자바스크립트</text>
  <text x="200" y="72" font-size="12" fill="#1a1a1a">웹 페이지의 동작을 제어하는 클라이언트용 스크립트 언어</text>

  <rect x="30" y="86" width="150" height="38" fill="#eef1f4" stroke="#9aa4ae" stroke-width="1"/>
  <rect x="180" y="86" width="510" height="38" fill="#fff" stroke="#9aa4ae" stroke-width="1"/>
  <text x="105" y="110" font-size="13" font-weight="800" text-anchor="middle" fill="#0a3d5c" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">PHP</text>
  <text x="200" y="110" font-size="12" fill="#1a1a1a">Linux, Unix, Windows에서 사용 가능한 서버용 스크립트 언어</text>

  <rect x="30" y="124" width="150" height="38" fill="#eef1f4" stroke="#9aa4ae" stroke-width="1"/>
  <rect x="180" y="124" width="510" height="38" fill="#fff" stroke="#9aa4ae" stroke-width="1"/>
  <text x="105" y="148" font-size="13" font-weight="800" text-anchor="middle" fill="#0a3d5c">파이썬(Python)</text>
  <text x="200" y="148" font-size="12" fill="#1a1a1a">귀도 반 로섬이 발표한 대화형 인터프리터 언어</text>

  <rect x="30" y="162" width="150" height="38" fill="#eef1f4" stroke="#9aa4ae" stroke-width="1"/>
  <rect x="180" y="162" width="510" height="38" fill="#fff" stroke="#9aa4ae" stroke-width="1"/>
  <text x="105" y="186" font-size="13" font-weight="800" text-anchor="middle" fill="#0a3d5c">쉘 스크립트</text>
  <text x="200" y="186" font-size="12" fill="#1a1a1a">쉘에서 사용되는 명령어들의 조합으로 구성된 스크립트 언어</text>

  <rect x="30" y="200" width="150" height="38" fill="#eef1f4" stroke="#9aa4ae" stroke-width="1"/>
  <rect x="180" y="200" width="510" height="38" fill="#fff" stroke="#9aa4ae" stroke-width="1"/>
  <text x="105" y="224" font-size="13" font-weight="800" text-anchor="middle" fill="#0a3d5c">Basic</text>
  <text x="200" y="224" font-size="12" fill="#1a1a1a">절차지향 기능을 지원하는 대화형 인터프리터 언어</text>

  <rect x="30" y="14" width="660" height="224" fill="none" stroke="#9aa4ae" stroke-width="1.5"/>
  <line x1="180" y1="14" x2="180" y2="238" stroke="#0b8ad4" stroke-width="2"/>
</svg>
