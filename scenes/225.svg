<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220">
  <rect x="30" y="20" width="320" height="85" rx="8" fill="#e8f4fc" stroke="#0b8ad4" stroke-width="2"/>
  <text x="60" y="55" font-size="24">🔍</text>
  <text x="95" y="46" font-size="14" font-weight="800" fill="#0a3d5c">분석 (Analysis)</text>
  <text x="95" y="66" font-size="11.5" fill="#1a1a1a">기존 SW 명세를 확인해 동작을 이해,</text>
  <text x="95" y="82" font-size="11.5" fill="#1a1a1a">재공학 대상을 선정</text>

  <rect x="370" y="20" width="320" height="85" rx="8" fill="#e8f4fc" stroke="#0b8ad4" stroke-width="2"/>
  <text x="400" y="55" font-size="24">🔧</text>
  <text x="435" y="46" font-size="14" font-weight="800" fill="#0a3d5c">재구성 (Restructuring)</text>
  <text x="435" y="66" font-size="11.5" fill="#1a1a1a">기존 SW 구조를 향상시키기 위해</text>
  <text x="435" y="82" font-size="11.5" fill="#1a1a1a">코드를 재구성</text>

  <rect x="30" y="120" width="320" height="85" rx="8" fill="#fff3d6" stroke="#e8b33a" stroke-width="2"/>
  <text x="60" y="155" font-size="24">🔄</text>
  <text x="95" y="146" font-size="14" font-weight="800" fill="#0a3d5c">역공학 (Reverse Eng.)</text>
  <text x="95" y="166" font-size="11.5" fill="#1a1a1a">기존 SW를 분석해 개발·데이터 처리</text>
  <text x="95" y="182" font-size="11.5" fill="#1a1a1a">과정의 설계 정보를 재발견</text>

  <rect x="370" y="120" width="320" height="85" rx="8" fill="#fff3d6" stroke="#e8b33a" stroke-width="2"/>
  <text x="400" y="155" font-size="24">🚚</text>
  <text x="435" y="146" font-size="14" font-weight="800" fill="#0a3d5c">이식 (Migration)</text>
  <text x="435" y="166" font-size="11.5" fill="#1a1a1a">다른 운영체제·하드웨어 환경에서</text>
  <text x="435" y="182" font-size="11.5" fill="#1a1a1a">사용 가능하도록 변환</text>
</svg>
