  </defs>
  <rect x="180" y="16" width="360" height="38" rx="8" fill="#eef1f4" stroke="#9aa4ae" stroke-width="1.5"/>
  <text x="360" y="40" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a1a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">mx = a &lt; b ? b : a;</text>

  <polygon points="170,66 250,106 170,146 90,106" fill="#e8f4fc" stroke="#0b8ad4" stroke-width="2.5"/>
