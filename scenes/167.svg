  <text x="170" y="118" font-size="10" text-anchor="middle" fill="#0a3d5c">조건</text>

  <path d="M248 88 L330 60" stroke="#0b8ad4" stroke-width="2.5" fill="none" marker-end="url(#arw167)"/>
