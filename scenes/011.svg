<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210">
  <rect x="24" y="16" width="672" height="28" rx="5" fill="#4a5560"/>
  <text x="80" y="35" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">기호</text>
  <text x="360" y="35" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">의미</text>
  <text x="560" y="35" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">설명</text>
  <rect x="24" y="48" width="672" height="26" rx="3" fill="#e8f4fc"/>
  <text x="80" y="66" font-size="18" font-weight="800" fill="#0b8ad4" text-anchor="middle">=</text>
  <text x="360" y="66" font-size="14" fill="#1a1a1a" text-anchor="middle">정의</text>
  <text x="560" y="66" font-size="12" fill="#9aa4ae" text-anchor="middle">~로 구성되어 있다</text>
  <rect x="24" y="78" width="672" height="26" rx="3" fill="#fff"/>
  <text x="80" y="96" font-size="18" font-weight="800" fill="#0b8ad4" text-anchor="middle">+</text>
  <text x="360" y="96" font-size="14" fill="#1a1a1a" text-anchor="middle">연결</text>
  <text x="560" y="96" font-size="12" fill="#9aa4ae" text-anchor="middle">그리고 (AND)</text>
  <rect x="24" y="108" width="672" height="26" rx="3" fill="#e8f4fc"/>
  <text x="80" y="126" font-size="18" font-weight="800" fill="#0b8ad4" text-anchor="middle">( )</text>
  <text x="360" y="126" font-size="14" fill="#1a1a1a" text-anchor="middle">생략</text>
  <text x="560" y="126" font-size="12" fill="#9aa4ae" text-anchor="middle">있어도 되고 없어도 됨 (Optional)</text>
  <rect x="24" y="138" width="672" height="26" rx="3" fill="#fff"/>
  <text x="80" y="156" font-size="16" font-weight="800" fill="#0b8ad4" text-anchor="middle">[ | ]</text>
  <text x="360" y="156" font-size="14" fill="#1a1a1a" text-anchor="middle">선택</text>
  <text x="560" y="156" font-size="12" fill="#9aa4ae" text-anchor="middle">또는 (OR)</text>
  <rect x="24" y="168" width="672" height="26" rx="3" fill="#e8f4fc"/>
  <text x="80" y="186" font-size="18" font-weight="800" fill="#0b8ad4" text-anchor="middle">{ }</text>
  <text x="360" y="186" font-size="14" fill="#1a1a1a" text-anchor="middle">반복</text>
  <text x="560" y="186" font-size="12" fill="#9aa4ae" text-anchor="middle">중괄호 안의 항목 반복</text>
</svg>